name: Security and build checks
on:
  pull_request:
  push:
    branches: [security/phase-1-hardening]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full audit including Safari journeys
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Check PRs before merging; Vercel already builds the resulting main deployment.
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - name: Check villa community hearts
        run: |
          node scripts/test-villa-enquiry-draft.cjs
          node scripts/verify-haumiere-stay.cjs
          node scripts/verify-villa-stay.cjs
          node scripts/test-villa-contact.cjs
          node scripts/test-villa-hearts.cjs
          node scripts/test-villa-hearts-db.mjs
      - name: Check villa budgets and protected collections
        run: |
          node scripts/verify-stay-filters.cjs
          node scripts/test-villa-collections-db.mjs
      - name: Check place content, hiking routes and SEO
        run: |
          node scripts/test-san-peire-routes.cjs
          node scripts/test-hiking-routes.cjs
          node scripts/test-event-structured-data.cjs
          node scripts/test-event-journey.cjs
          node scripts/test-agenda-discovery.cjs
          node scripts/test-agenda-dark.cjs
          node scripts/test-guides-seo.cjs
          node scripts/test-place-seo.cjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com
  full_review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
    runs-on: ubuntu-latest
    # Keep this image aligned with the exact Playwright version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check preinstalled Safari engine
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { webkit } = require('playwright');
          assert.equal(require('playwright/package.json').version, '1.62.1', 'Align the CI image with the project Playwright version.');
          (async () => {
            const browser = await webkit.launch();
            await browser.close();
            console.log('Preinstalled WebKit launches successfully.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - run: npm run test:security
      - run: node scripts/test-admin.cjs
      - run: node scripts/test-direct-contact.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/test-seo.cjs
      - run: node scripts/test-public-routes.cjs
      - run: node scripts/test-place-crawlability.cjs
      - run: node scripts/test-guides-seo.cjs
      - run: node scripts/test-associations.cjs
      - run: node scripts/test-place-facts.cjs
      - run: node scripts/test-place-seo.cjs
      - run: node scripts/test-place-maps.cjs
      - run: node scripts/test-nearby-explorer.cjs
      - run: node scripts/test-verified-local-catalog.cjs
      - run: node scripts/test-place-gallery.cjs
      - run: node scripts/test-place-images.cjs
      - run: node scripts/test-tourist-map.cjs
      - run: node scripts/test-explore-filters.cjs
      - run: node scripts/test-ask-matching.cjs
      - run: node scripts/test-saved-day-plan.cjs
      - run: node scripts/test-stay-journey.cjs
      - run: node scripts/test-my-stay-contrast.cjs
      - run: node scripts/test-cloud-day-plan.cjs
      - run: node scripts/test-villa-languages.cjs
      - run: node scripts/test-villa-contact.cjs
      - run: node scripts/test-public-members.cjs
      - run: node scripts/test-account-workspace.cjs
      - run: node scripts/test-site-footer.cjs
      - run: node scripts/test-agenda-dark.cjs
      - run: node scripts/test-profile-agenda.cjs
      - run: node scripts/test-agenda-feeds.cjs
      - run: node scripts/test-official-agenda-feeds.cjs
      - run: node scripts/test-agenda-discovery.cjs
      - run: node scripts/test-agenda-quality.cjs
      - run: node scripts/test-cinema.cjs
      - run: node scripts/test-local-news.cjs
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com

      - name: Verify outing and saved-event journey on mobile Safari
        run: node scripts/test-outing-browser.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com
      - name: Verify global footer and information pages
        run: node scripts/test-footer-browser.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com
      - name: Verify place pages at iPhone widths
        run: npm run test:mobile
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com
      - name: Verify cinema filters on mobile Safari
        run: node scripts/test-cinema-browser.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com
      - name: Verify local news on mobile Safari
        run: node scripts/test-local-news-browser.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com
      - name: Verify map previews on mobile and desktop Safari
        run: node scripts/test-discovery-map-browser.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com
      - name: Save footer screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: footer-webkit
          path: test-results/footer
          if-no-files-found: ignore
      - name: Save map preview screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-map-webkit
          path: test-results/discovery-map
          if-no-files-found: ignore
      - name: Save cinema screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinema-mobile-webkit
          path: test-results/cinema
          if-no-files-found: ignore
      - name: Save mobile checks and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: place-mobile-webkit
          path: test-results/place-mobile
          if-no-files-found: ignore
      - name: Save local news screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-news-mobile-webkit
          path: test-results/local-news
          if-no-files-found: ignore
