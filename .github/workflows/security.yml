name: Security and build checks
on:
  pull_request:
  push:
    branches: [main, security/phase-1-hardening]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: node scripts/test-admin.cjs
      - run: node scripts/test-direct-contact.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/test-seo.cjs
      - run: node scripts/test-guides-seo.cjs
      - run: node scripts/test-place-facts.cjs
      - run: node scripts/test-place-maps.cjs
      - run: node scripts/test-place-gallery.cjs
      - run: node scripts/test-tourist-map.cjs
      - run: node scripts/test-explore-filters.cjs
      - run: node scripts/test-villa-languages.cjs
      - run: node scripts/test-profile-agenda.cjs
      - run: node scripts/test-agenda-feeds.cjs
      - run: node scripts/test-local-news.cjs
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_SITE_URL: https://legolfe.com
